name: fcp-CasinoRoulette
version: 1.0.0
main: Frontiks.Craft.casino.CasinoPlugin
api-version: '1.21'
author: Frontiks
description: FCP european roulette — shared GUI rounds, bets on FCP coins
softdepend: [FCP-Core, FCP-EconomyMarket]
commands:
  roulette:
    description: Управление казино-рулеткой
    usage: /roulette [balance|give|set|reload]
    aliases: [roulet, casino, rl]
permissions:
  roulette.admin:
    description: Админские команды казино
    default: op
  roulette.play:
    description: Позволяет делать ставки
    default: true
