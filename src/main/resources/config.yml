# ============================================================
#  fcp-CasinoRoulette — конфигурация
#  Все сообщения поддерживают цветовые коды '&' и плейсхолдеры.
# ============================================================

# --- Валюта FCP ---
# coins (по умолчанию) — основная валюта FCP (%fcp_coins%);
# dcoins — донат-монеты (%fcp_donate_coins%).
# Без FCP-EconomyMarket казино работает на тестовом кошельке balances.yml.
fcp-currency: coins

# --- Общий раунд GUI (все игроки ставят на один спин) ---
betting-seconds: 20        # сколько принимаются ставки
result-seconds: 5          # сколько показывается результат
spin-seconds: 12           # длительность анимации в GUI
ball-turns: 5.0            # количество оборотов подсветки в порядке EUROPEAN_ORDER
wheel-turns: 2.5           # устаревший ключ, не влияет на GUI

# --- Лимиты ставок ---
min-bet: 10
max-bet: 100000            # максимум на одну позицию (суммарно)
max-total-per-spin: 500000 # максимум суммарных ставок игрока за прокрутку
return-stake-on-win: true  # возвращать ли ставку вместе с выигрышем
broadcast-radius: 30       # старый ключ: GUI оповещает участников общего раунда

# --- Совместимость со старым config.yml (поля ниже сохранены, но GUI их не использует) ---
show-table-numbers: true   # устаревший ключ, не влияет на GUI
show-wheel-numbers: false  # устаревший ключ, не влияет на GUI
chip-material: SUNFLOWER   # устаревший ключ, фишки выбираются в GUI
chip-name: "&6&lФИШКА"     # устаревший ключ, не влияет на GUI

# --- Номиналы фишек и материалы их иконок в GUI ---
chips:
  denominations: [10, 50, 100, 500, 1000]
  colors:
    10: WHITE_CARPET
    50: ORANGE_CARPET
    100: LIGHT_BLUE_CARPET
    500: PURPLE_CARPET
    1000: YELLOW_CARPET

